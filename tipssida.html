<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Foodie Map - Tips</title>
  <link rel="stylesheet" href="/src/css/tipssida.css">
</head>
<body>
  <main>
    <h1>Restaurangtips</h1>
    <p>Föreslå special diet hos en restaurang i Stockholm.</p>

    <form id="tips-form">
      <div>
        <label for="name">Ditt fullständiga namn:</label>
        <input type="text" id="name" name="name" required>
      </div>
      <div>
        <label for="email">Din email:</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div>
        <label for="description">Beskrivning</label>
        <textarea id="description" name="description" rows="4" required></textarea>
      </div>
      <button type="submit">Skicka tips</button>
    </form>

  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
